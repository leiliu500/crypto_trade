name: crypto-trade

services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-trade-engine:latest
    container_name: crypto-trade-engine
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: UTC
      CONFIG_DIR: /app/config
      TRADING_MODE: ${TRADING_MODE:-shadow}
      TRADING_VENUE: ${TRADING_VENUE:-kraken_futures}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
      APCA_API_KEY_ID: ${APCA_API_KEY_ID:-}
      APCA_API_SECRET_KEY: ${APCA_API_SECRET_KEY:-}
      ALPACA_PAPER: ${ALPACA_PAPER:-true}
      PAPER_ENTRY_EXERCISE: ${PAPER_ENTRY_EXERCISE:-false}
      CRYPTO_SHORT_OPTIONS_ENABLED: ${CRYPTO_SHORT_OPTIONS_ENABLED:-false}
      KRAKEN_FUTURES_WEBSOCKET_URL: ${KRAKEN_FUTURES_WEBSOCKET_URL:-wss://futures.kraken.com/ws/v1}
      KRAKEN_FUTURES_SYMBOL_MAP_JSON: ${KRAKEN_FUTURES_SYMBOL_MAP_JSON:-{"BTC/USD":"PF_XBTUSD","ETH/USD":"PF_ETHUSD"}}
      KRAKEN_PAPER_INITIAL_EQUITY: ${KRAKEN_PAPER_INITIAL_EQUITY:-100000}
      KRAKEN_PAPER_STATE_FILE: ${KRAKEN_PAPER_STATE_FILE:-/app/data/kraken-paper-state.json}
      KRAKEN_FUTURES_MAKER_FEE_BPS: ${KRAKEN_FUTURES_MAKER_FEE_BPS:-2}
      KRAKEN_FUTURES_TAKER_FEE_BPS: ${KRAKEN_FUTURES_TAKER_FEE_BPS:-5}
      KRAKEN_FUTURES_FUNDING_RESERVE_BPS: ${KRAKEN_FUTURES_FUNDING_RESERVE_BPS:-0}
      OPTIONS_SHORT_LIVE_CONFIRMATION: ${OPTIONS_SHORT_LIVE_CONFIRMATION:-}
      ALLOW_LIVE_TRADING: ${ALLOW_LIVE_TRADING:-false}
      LIVE_TRADING_CONFIRMATION: ${LIVE_TRADING_CONFIRMATION:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-crypto_trade}
      POSTGRES_USER: ${POSTGRES_USER:-crypto_trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto_trade_dev}
    ports:
      - "3001:3001"
    volumes:
      - crypto_trade_event_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    container_name: crypto-trade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_trade}
      POSTGRES_USER: ${POSTGRES_USER:-crypto_trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto_trade_dev}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - crypto_trade_postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  crypto_trade_postgres_data:
    name: crypto_trade_postgres_data
  crypto_trade_event_data:
    name: crypto_trade_event_data
