name: crypto-trade

services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto-trade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_trade}
      POSTGRES_USER: ${POSTGRES_USER:-crypto_trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto_trade_dev}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - crypto_trade_postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  crypto_trade_postgres_data:
    name: crypto_trade_postgres_data
