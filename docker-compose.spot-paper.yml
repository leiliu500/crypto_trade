name: crypto-spot-paper
services:
  spot-paper:
    build:
      context: .
      dockerfile: docker/spot-paper.Dockerfile
    image: crypto-spot-trend-paper:v3
    container_name: crypto-spot-trend-paper
    restart: unless-stopped
    init: true
    networks:
      - default
      - trading_dashboard
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - spot_trend_research:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  spot_trend_research:
    name: crypto_trade_spot_trend_research
networks:
  trading_dashboard:
    external: true
    name: crypto-trade_default
